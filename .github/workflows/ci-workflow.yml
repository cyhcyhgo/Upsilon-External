name: Smart Build & Push (Fixed Environment)

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Build Mode'
        required: true
        default: 'incremental'
        type: choice
        options:
          - 'incremental'
          - 'full_rebuild'

permissions:
  contents: write # 只需要写仓库权限

jobs:
  # =========================================================
  # JOB 1: 智能分析 
  # =========================================================
  setup-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_apps: ${{ steps.set-matrix.outputs.has_apps }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: set-matrix
        run: |
          MODE="${{ inputs.build_mode }}"
          if [ "$MODE" == "full_rebuild" ]; then
            APPS=$(find apps -maxdepth 2 -name Makefile | awk -F/ '{print $2}' | sort | uniq)
          else
            APPS=$(git diff --name-only HEAD~1 HEAD | grep "^apps/" | awk -F/ '{print $2}' | sort | uniq)
          fi
          if [ ! -z "$APPS" ]; then
            APPS_JSON=$(echo "$APPS" | jq -R . | jq -s -c .)
            echo "has_apps=true" >> $GITHUB_OUTPUT
            echo "matrix=$APPS_JSON" >> $GITHUB_OUTPUT
          else
            echo "has_apps=false" >> $GITHUB_OUTPUT
          fi

  # =========================================================
  # JOB 2: 构建 App (关键修复：恢复了完整的依赖列表)
  # =========================================================
  build_apps:
    needs: setup-matrix
    if: ${{ needs.setup-matrix.outputs.has_apps == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.setup-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }

      # [修复点 1] 恢复完整的依赖列表，确保 KhiCAS 有 GMP/MPFR 等库支持
      - name: Install Full Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gdb gcc g++ libgmp-dev libmpfr-dev libmpfi-dev libpari-dev libgsl0-dev libxext-dev libpng-dev libjpeg-dev libreadline-dev libncurses5-dev mesa-common-dev libx11-dev libxt-dev libxft-dev libntl-dev libgl1-mesa-dev libgl-dev libao-dev hevea debhelper libfltk1.3-dev build-essential git imagemagick libx11-dev libxext-dev libfreetype6-dev libpng-dev libjpeg-dev pkg-config gcc-arm-none-eabi binutils-arm-none-eabi dfu-util texinfo autoconf-archive

      # [修复点 2] 恢复 KhiCAS 的 MicroPython 补丁，防止把警告当错误处理
      - name: Build ${{ matrix.app }}
        run: |
          if [ -f "apps/KhiCAS/Makefile" ] && [ "${{ matrix.app }}" == "KhiCAS" ]; then
             echo "Applying MicroPython patch for KhiCAS..."
             sed -i 's/\$$(CC) \$$(CFLAGS)/\$$(CC) \$$(CFLAGS) -Wno-error/g' apps/KhiCAS/src/micropython-1.12/py/mkrules.mk || true
          fi
          make ${{ matrix.app }}_rebuild

      # [新增步骤] 验证链接 (Dry Run)
      # 这一步会尝试运行 ./tool/archive，如果链接失败会直接报错退出
      # 我们只对 KhiCAS 执行此检查，或者对所有 App 执行都可以
      - name: Verify Linker (Archive Step)
        if: ${{ matrix.app == 'KhiCAS' }}  # 仅针对 KhiCAS，或者去掉这行对所有 App 验证
        run: |
          echo "Verifying linking process for ${{ matrix.app }}..."
          # 尝试运行 archive 工具生成 tar 包
          # 如果这里报错 "undefined reference"，GitHub Action 会标记为失败
          ./tool/archive ${{ matrix.app }}_verify.tar ${{ matrix.app }}
          
          echo "Link verification successful!"
          # 验证完后删除生成的测试包，以免占用空间或混淆后续步骤
          rm ${{ matrix.app }}_verify.tar

      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.app }}
          path: |
            apps/${{ matrix.app }}/app.elf
            apps/${{ matrix.app }}/app.icon

  # =========================================================
  # JOB 3: 精准同步 (修复图片与重复文件)
  # =========================================================
  deploy_site:
    runs-on: ubuntu-latest
    needs: [setup-matrix, build_apps]
    if: always()
    steps:
      # 1. 检出源码 (main)
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          path: source_code

      # 2. 检出网站分支 (gh-pages)
      - name: Checkout Website Branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: website_root
        continue-on-error: true

      # 3. 初始化与清理
      - name: Prepare Website Root
        run: |
          # 确保目录存在
          if [ ! -d "website_root" ]; then
            mkdir website_root
            cd website_root
            git init
            git checkout -b gh-pages
            cd ..
          fi
          mkdir -p website_root/apps

          # 【修复 2】强制删除 apps 目录下可能残留的 index.html
          rm -f website_root/apps/index.html

      # 4. 同步根目录文件 (HTML, JS, Libs)
      - name: Sync Root Files
        run: |
          echo ">>> Syncing root files..."
          # 排除 apps 和 .git，同步其他所有 (包含根目录的 index.html)
          rsync -av --exclude='.git' --exclude='apps' source_code/ website_root/
          
          # 确保 .nojekyll
          touch website_root/.nojekyll

      # 5. 同步 apps 目录下的必要文件 (apps.js, external.ld)
      - name: Sync Apps Config Files
        run: |
          echo ">>> Syncing apps/*.js and apps/*.ld..."
          # 只查找文件，排除 index.html
          find source_code/apps -maxdepth 1 -type f -not -name "index.html" -exec cp {} website_root/apps/ \;

      # 6. 【修复 1】从源码中提取 icon.png
      - name: Sync App Icons from Source
        run: |
          echo ">>> Extracting icon.png from source..."
          cd source_code
          # 查找 apps 文件夹下所有的 icon.png
          # --parents 会保留路径结构 (例如 apps/Video/icon.png)
          find apps -name "icon.png" -exec cp --parents {} ../website_root/ \;
          cd ..

      # 7. 下载构建产物 (app.elf, app.icon)
      - name: Download New Artifacts
        if: ${{ needs.setup-matrix.outputs.has_apps == 'true' }}
        uses: actions/download-artifact@v4
        with:
          path: temp_artifacts
          pattern: build-*

      # 8. 合并构建产物
      - name: Merge Compiled Binaries
        run: |
          if [ -d "temp_artifacts" ]; then
            for artifact in temp_artifacts/build-*; do
              if [ -d "$artifact" ]; then
                APP_NAME=$(basename "$artifact" | sed 's/build-//')
                echo "Deploying Binary: $APP_NAME"
                
                TARGET_DIR="website_root/apps/$APP_NAME"
                mkdir -p "$TARGET_DIR"
                
                # 复制 elf 和 icon (二进制格式)
                find "$artifact" -name "app.elf" -exec cp {} "$TARGET_DIR/" \;
                find "$artifact" -name "app.icon" -exec cp {} "$TARGET_DIR/" \;
              fi
            done
          fi

      # 9. 提交
      - name: Push to gh-pages
        run: |
          cd website_root
          git config user.name "Action Bot"
          git config user.email "bot@action"
          git add .
          
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Deploy site (Fixed icons & html) [$(date)]"
            git push origin HEAD:gh-pages --force
          fi
