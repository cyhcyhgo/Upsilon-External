name: Smart Build & Push

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Build Mode'
        required: true
        default: 'incremental'
        type: choice
        options:
          - 'incremental'
          - 'full_rebuild'

permissions:
  contents: write # 只需要写权限，不需要 pages 权限

jobs:
  # JOB 1: 分析 (保持不变)
  setup-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_apps: ${{ steps.set-matrix.outputs.has_apps }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: set-matrix
        run: |
          MODE="${{ inputs.build_mode }}"
          if [ "$MODE" == "full_rebuild" ]; then
            APPS=$(find apps -maxdepth 2 -name Makefile | awk -F/ '{print $2}' | sort | uniq)
          else
            APPS=$(git diff --name-only HEAD~1 HEAD | grep "^apps/" | awk -F/ '{print $2}' | sort | uniq)
          fi
          if [ ! -z "$APPS" ]; then
            APPS_JSON=$(echo "$APPS" | jq -R . | jq -s -c .)
            echo "has_apps=true" >> $GITHUB_OUTPUT
            echo "matrix=$APPS_JSON" >> $GITHUB_OUTPUT
          else
            echo "has_apps=false" >> $GITHUB_OUTPUT
          fi

  # JOB 2: 构建 (保持不变)
  build_apps:
    needs: setup-matrix
    if: ${{ needs.setup-matrix.outputs.has_apps == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.setup-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }
      - name: Install Deps
        run: sudo apt-get update && sudo apt-get install -y build-essential libmpfr-dev libmpfi-dev libpari-dev libfltk1.3-dev binutils-arm-none-eabi gcc-arm-none-eabi
      - name: Build
        run: make ${{ matrix.app }}_rebuild
      # 依旧上传 Artifact，用于在不同 Job 间传递文件
      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.app }}
          path: apps/${{ matrix.app }}/app.elf

  # =================================================================================
  # JOB 3: 这里的逻辑就是你想要的 -> 拿回旧文件，覆盖新文件，提交
  # =================================================================================
  update_site:
    runs-on: ubuntu-latest
    needs: [setup-matrix, build_apps]
    if: always()
    
    steps:
      # 1. "复制原网站的所有文件" -> 本质就是检出 gh-pages 分支
      - name: Checkout Website Branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages # 这是一个标准分支，用来存放网站文件
          path: website_root
        continue-on-error: true # 第一次如果没有这个分支，不报错

      # 2. 如果第一次运行，没有这个分支，就创建空文件夹
      - name: Init if Missing
        run: |
          if [ ! -d "website_root" ]; then
            mkdir website_root
            cd website_root
            git init
            git checkout -b gh-pages
            touch .nojekyll
            cd ..
          fi

      # 3. 如果是全量重构，清空旧文件
      - name: Clean if Full Rebuild
        if: ${{ inputs.build_mode == 'full_rebuild' }}
        run: rm -rf website_root/apps

      # 4. 下载新编译好的文件
      - name: Download Artifacts
        if: ${{ needs.setup-matrix.outputs.has_apps == 'true' }}
        uses: actions/download-artifact@v4
        with:
          path: temp_artifacts
          pattern: build-*

      # 5. 把新文件塞进去 (增量更新逻辑)
      - name: Merge New Apps
        run: |
          if [ ! -d "temp_artifacts" ]; then echo "No artifacts"; exit 0; fi
          mkdir -p website_root/apps
          
          for artifact in temp_artifacts/build-*; do
            if [ -d "$artifact" ]; then
              APP_NAME=$(basename "$artifact" | sed 's/build-//')
              echo "Updating $APP_NAME..."
              
              # 目标路径: website_root/apps/App名字/
              TARGET_DIR="website_root/apps/$APP_NAME"
              mkdir -p "$TARGET_DIR"
              
              # 查找并复制 .elf
              find "$artifact" -name "app.elf" -exec cp {} "$TARGET_DIR/" \;
              find "$artifact" -name "app.icon" -exec cp {} "$TARGET_DIR/" \;
            fi
          done

      # 6. 生成索引
      - name: Update Index
        run: |
          cd website_root/apps || exit 0
          echo "<h1>App Downloads</h1><hr><ul>" > index.html
          ls -1 | grep -v "index.html" | sort | while read f; do 
             echo "<li><a href='$f/app.elf'>$f</a></li>" >> index.html
          done
          echo "</ul>" >> index.html

      # 7. 提交并推送 -> 这一步完成后，GitHub Pages 会自动触发另一个系统内置的工作流来发布
      - name: Push Changes
        run: |
          cd website_root
          git config user.name "Action Bot"
          git config user.email "bot@action"
          git add .
          git commit -m "Update apps [$(date)]" || echo "No changes"
          git push origin HEAD:gh-pages --force
