name: Smart Build & Push (Fixed Environment)

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Build Mode'
        required: true
        default: 'incremental'
        type: choice
        options:
          - 'incremental'
          - 'full_rebuild'

permissions:
  contents: write # 只需要写仓库权限

jobs:
  # =========================================================
  # JOB 1: 智能分析 (保持不变)
  # =========================================================
  setup-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_apps: ${{ steps.set-matrix.outputs.has_apps }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: set-matrix
        run: |
          MODE="${{ inputs.build_mode }}"
          if [ "$MODE" == "full_rebuild" ]; then
            APPS=$(find apps -maxdepth 2 -name Makefile | awk -F/ '{print $2}' | sort | uniq)
          else
            APPS=$(git diff --name-only HEAD~1 HEAD | grep "^apps/" | awk -F/ '{print $2}' | sort | uniq)
          fi
          if [ ! -z "$APPS" ]; then
            APPS_JSON=$(echo "$APPS" | jq -R . | jq -s -c .)
            echo "has_apps=true" >> $GITHUB_OUTPUT
            echo "matrix=$APPS_JSON" >> $GITHUB_OUTPUT
          else
            echo "has_apps=false" >> $GITHUB_OUTPUT
          fi

  # =========================================================
  # JOB 2: 构建 App (关键修复：恢复了完整的依赖列表)
  # =========================================================
  build_apps:
    needs: setup-matrix
    if: ${{ needs.setup-matrix.outputs.has_apps == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.setup-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }

      # [修复点 1] 恢复完整的依赖列表，确保 KhiCAS 有 GMP/MPFR 等库支持
      - name: Install Full Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gdb gcc g++ libgmp-dev libmpfr-dev libmpfi-dev libpari-dev libgsl0-dev libxext-dev libpng-dev libjpeg-dev libreadline-dev libncurses5-dev mesa-common-dev libx11-dev libxt-dev libxft-dev libntl-dev libgl1-mesa-dev libgl-dev libao-dev hevea debhelper libfltk1.3-dev build-essential git imagemagick libx11-dev libxext-dev libfreetype6-dev libpng-dev libjpeg-dev pkg-config gcc-arm-none-eabi binutils-arm-none-eabi dfu-util texinfo autoconf-archive

      # [修复点 2] 恢复 KhiCAS 的 MicroPython 补丁，防止把警告当错误处理
      - name: Build ${{ matrix.app }}
        run: |
          if [ -f "apps/KhiCAS/Makefile" ] && [ "${{ matrix.app }}" == "KhiCAS" ]; then
             echo "Applying MicroPython patch for KhiCAS..."
             sed -i 's/\$$(CC) \$$(CFLAGS)/\$$(CC) \$$(CFLAGS) -Wno-error/g' apps/KhiCAS/src/micropython-1.12/py/mkrules.mk || true
          fi
          make ${{ matrix.app }}_rebuild

      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.app }}
          path: |
            apps/${{ matrix.app }}/app.elf
            apps/${{ matrix.app }}/app.icon

  # =========================================================
  # JOB 3: 精准同步与发布
  # =========================================================
  deploy_site:
    runs-on: ubuntu-latest
    needs: [setup-matrix, build_apps]
    if: always()
    steps:
      # 1. 检出源码 (main) -> 获取最新的 index.html, libs, apps.js 等
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          path: source_code

      # 2. 检出网站分支 (gh-pages) -> 获取旧的 App 二进制文件
      - name: Checkout Website Branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: website_root
        continue-on-error: true

      # 3. 初始化网站目录 (防止第一次运行报错)
      - name: Prepare Website Root
        run: |
          if [ ! -d "website_root" ]; then
            echo "Creating new website root..."
            mkdir website_root
            cd website_root
            git init
            git checkout -b gh-pages
            cd ..
          fi
          # 确保 apps 目录存在
          mkdir -p website_root/apps

      # 4. 【核心步骤】同步文件 (你的需求实现)
      - name: Sync Site Files (Exclude App Source)
        run: |
          echo ">>> Step A: Syncing root files (HTML, JS, Libs, Images)..."
          # 使用 rsync 同步所有文件，但完全排除 .git 和 apps 文件夹
          # 这样 index.html, libs/, images/ 等都会被更新
          rsync -av --exclude='.git' --exclude='apps' source_code/ website_root/

          echo ">>> Step B: Syncing 'apps/' files ONLY (apps.js, external.ld)..."
          # 使用 find 命令，只查找 apps/ 下的“文件”，不查找“目录”
          # 这样就复制了 apps.js, external.ld，但跳过了 apps/KhiCAS/ 等源码目录
          find source_code/apps -maxdepth 1 -type f -exec cp {} website_root/apps/ \;

          echo ">>> Step C: Ensuring .nojekyll exists..."
          touch website_root/.nojekyll

      # 5. 下载本次构建的新 App
      - name: Download New Artifacts
        if: ${{ needs.setup-matrix.outputs.has_apps == 'true' }}
        uses: actions/download-artifact@v4
        with:
          path: temp_artifacts
          pattern: build-*

      # 6. 合并新编译的 App
      - name: Merge New Compiled Apps
        run: |
          if [ -d "temp_artifacts" ]; then
            for artifact in temp_artifacts/build-*; do
              if [ -d "$artifact" ]; then
                APP_NAME=$(basename "$artifact" | sed 's/build-//')
                echo "Deploying Binary for: $APP_NAME"
                
                TARGET_DIR="website_root/apps/$APP_NAME"
                mkdir -p "$TARGET_DIR"
                
                # 只复制二进制文件和图标，覆盖旧的
                find "$artifact" -name "app.elf" -exec cp {} "$TARGET_DIR/" \;
                find "$artifact" -name "app.icon" -exec cp {} "$TARGET_DIR/" \;
              fi
            done
          fi

      # 7. 提交并推送
      - name: Push to gh-pages
        run: |
          cd website_root
          git config user.name "Action Bot"
          git config user.email "bot@action"
          git add .
          
          # 检查是否有变化
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Sync site and update apps [$(date)]"
            git push origin HEAD:gh-pages --force
          fi
